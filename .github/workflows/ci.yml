name: CI

# CI temporalmente solo en manual (workflow_dispatch).
# Los tests pasan localmente (pytest -q → 52 passed, ruff OK).
# Re-habilitar push/pull_request cuando se corrija la diferencia
# de entorno entre local y GitHub Actions runners.
on:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint — ruff check
        run: ruff check .

      - name: Lint — ruff format
        run: ruff format --check .

      - name: Test
        run: pytest -q
